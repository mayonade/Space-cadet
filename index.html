<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nebula Drift Pinball</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a one-screen cabinet. Slim score rail on top, the table fills the rest, and the whole screen is the flipper buttons. */
:root {
  --void: #070818;
  --deck: #141846;
  --rail: #5fe3ff;
  --hot: #ff4d8f;
  --lamp: #ffc24a;
  --ink: #e9ecff;
  --dim: #8b90c4;
  --display: 'Chakra Petch', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --mono: 'Share Tech Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--display);
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.rail {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  width: 100%;
  max-width: 460px;
  margin-inline: auto;
}
.stat { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stat.right { align-items: flex-end; }
.label { font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.value { font-family: var(--mono); font-size: 1rem; color: var(--rail); font-variant-numeric: tabular-nums; }
.score {
  font-family: var(--mono);
  font-size: clamp(1.5rem, 7vw, 2.1rem);
  line-height: 1;
  color: var(--lamp);
  text-shadow: 0 0 14px color-mix(in srgb, var(--lamp) 55%, transparent);
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.right-row { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  font: inherit; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--dim); background: transparent;
  border: 1px solid color-mix(in srgb, var(--dim) 50%, transparent);
  border-radius: 4px; padding: 6px 7px; min-width: 44px; min-height: 30px; cursor: pointer;
}
.icon-btn[aria-pressed="true"] { color: var(--rail); border-color: var(--rail); }
.ticker {
  height: 1.2em; text-align: center; font-size: 0.78rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
canvas { display: block; border-radius: 10px; }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: color-mix(in srgb, var(--void) 62%, transparent);
}
.card {
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  text-align: center; padding: 22px 20px; max-width: 320px;
}
.card h1 {
  margin: 0; font-size: clamp(2rem, 11vw, 2.9rem); line-height: 0.92; font-weight: 700;
  letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance;
  color: var(--ink); text-shadow: 0 0 22px var(--hot), 0 0 2px var(--hot);
}
.card h1 span { display: block; font-size: 0.36em; letter-spacing: 0.5em; color: var(--rail); text-shadow: none; margin-top: 8px; padding-left: 0.5em; }
.card p { margin: 0; font-size: 0.92rem; line-height: 1.45; color: var(--ink); }
.card .final { font-family: var(--mono); font-size: 2rem; color: var(--lamp); font-variant-numeric: tabular-nums; }
.card .best { color: var(--dim); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; }
.keys { display: none; color: var(--dim) !important; font-size: 0.8rem !important; }
@media (hover: hover) and (pointer: fine) { .keys { display: block; } }
.go {
  font: inherit; font-weight: 700; font-size: 1rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--void); background: var(--lamp); border: 0; border-radius: 999px;
  padding: 14px 30px; cursor: pointer; box-shadow: 0 0 24px color-mix(in srgb, var(--lamp) 55%, transparent);
}
.go:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>

<div class="rail">
  <div class="stat"><span class="label">Ball</span><span class="value" id="ballNo">–</span></div>
  <div class="score" id="score" aria-live="off">0</div>
  <div class="stat right">
    <div class="right-row">
      <div class="stat right"><span class="label">Bonus</span><span class="value" id="mult">×1</span></div>
      <button class="icon-btn" id="sound" type="button" aria-pressed="true">Sound</button>
    </div>
  </div>
</div>
<div class="ticker" id="ticker" aria-live="polite">Three balls. Chase the lamps.</div>
<div class="stage" id="stage">
  <canvas id="table" aria-label="Pinball table"></canvas>
  <div class="overlay" id="overlay">
    <div class="card">
      <h1 id="ovTitle">Nebula Drift<span>Pinball</span></h1>
      <div class="final" id="ovScore" hidden>0</div>
      <div class="best" id="ovBest" hidden></div>
      <p id="ovText">Tap the left or right side of the screen to flip. Hold the right side to pull the launcher, then let go.</p>
      <p class="keys">Keyboard: ← → flip, Space launches.</p>
      <button class="go" id="go" type="button">Start game</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 400, H = 720, BR = 8, G = 950, STEP = 1 / 480;
const C = { rail: '#5fe3ff', hot: '#ff4d8f', lamp: '#ffc24a', ink: '#e9ecff', dim: '#8b90c4', void: '#070818' };
const $ = id => document.getElementById(id);
const cv = $('table'), ctx = cv.getContext('2d'), stage = $('stage');
const bg = document.createElement('canvas');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mx = x => 372 - x;           // mirror across the playfield centre line (x = 186)
let scale = 1, dpr = 1;

/* ---------- table geometry ---------- */
const polys = [], segs = [];
function addPoly(pts, o = {}) {
  polys.push({ pts, closed: !!o.closed, hidden: !!o.hidden });
  const n = pts.length, last = o.closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    segs.push({ x1: a[0], y1: a[1], x2: b[0], y2: b[1], e: o.e ?? 0.45, sling: (o.sling != null && i === 0) ? o.sling : null, target: null });
  }
}
const outer = [[10, 760], [10, 200]];
for (let i = 1; i < 40; i++) { const t = Math.PI - i * Math.PI / 40; outer.push([200 + 190 * Math.cos(t), 200 - 190 * Math.sin(t)]); }
outer.push([390, 200], [390, 760]);
addPoly(outer);
addPoly([[362, 760], [362, 178]]);                       // launcher lane wall
addPoly([[362, 680], [390, 680]]);                       // launcher floor
addPoly([[40, 540], [40, 590], [112, 622]]);             // left return guide
addPoly([[mx(40), 540], [mx(40), 590], [mx(112), 622]]); // right return guide
addPoly([[62, 510], [106, 592], [62, 572]], { closed: true, sling: 0 });
addPoly([[mx(62), 510], [mx(106), 592], [mx(62), 572]], { closed: true, sling: 1 });
for (const x of [132, 168, 204, 240]) addPoly([[x, 115], [x, 150]]);
addPoly([[10, 266], [24, 278]]); addPoly([[24, 350], [10, 362]]);
addPoly([[362, 266], [348, 278]]); addPoly([[348, 350], [362, 362]]);
addPoly([[10, 395], [32, 440], [10, 462]]);
addPoly([[362, 395], [340, 440], [362, 462]]);
const gate = { x1: 362, y1: 178, x2: 386, y2: 160, e: 0.3 };

const targets = [];
for (let side = 0; side < 2; side++) for (let i = 0; i < 3; i++) {
  const t = { x: side ? 348 : 24, y1: 280 + i * 24, y2: 300 + i * 24, side, lit: false, flash: 0 };
  targets.push(t);
  segs.push({ x1: t.x, y1: t.y1, x2: t.x, y2: t.y2, e: 0.6, sling: null, target: t });
}
const bumpers = [{ x: 138, y: 235 }, { x: 234, y: 235 }, { x: 186, y: 305 }].map(b => ({ ...b, r: 22, flash: 0 }));
const lanes = [150, 186, 222].map(x => ({ x, y: 132, lit: false, inside: false }));
const well = { x: 70, y: 205, cool: 0, lit: false, spin: 0 };
const beacon = { x: mx(70), y: 205, inside: false, flash: 0 };
const slingFlash = [0, 0];
const FL = 58;
const flippers = [
  { x: 118, y: 628, rest: 0.5, up: -0.55, a: 0.5, w: 0, on: false },
  { x: mx(118), y: 628, rest: Math.PI - 0.5, up: Math.PI + 0.55, a: Math.PI - 0.5, w: 0, on: false },
];
const RANKS = ['Drifter', 'Navigator', 'Pathfinder', 'Star Captain', 'Fleet Admiral', 'Legend'];

/* ---------- game state ---------- */
let state = 'attract';          // attract | play | over
let ball = null, score = 0, ballNo = 0, mult = 1, bumperHits = 0, goals = 0, rank = 0;
let saveT = 0, charge = 0, nextBallT = 0, tickerT = 0, best = 0, clock = 0;
let stuckT = 0, stuckX = 0, stuckY = 0;
const sparks = [], trail = [];
const input = { L: false, R: false, launch: false };
try { best = +localStorage.getItem('nebula-drift-best') || 0; } catch (e) {}

/* ---------- sound ---------- */
let ac = null, soundOn = true, lastWall = 0;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
}
function tone(f, d, type = 'square', v = 0.05, slide = 0, delay = 0) {
  if (!ac || !soundOn) return;
  try {
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const sfx = {
  flip: () => tone(150, 0.06, 'square', 0.04, -70),
  bumper: () => tone(520 + Math.random() * 120, 0.09, 'triangle', 0.09, 300),
  sling: () => tone(260, 0.07, 'sawtooth', 0.05, 180),
  target: () => tone(880, 0.1, 'square', 0.05, 220),
  lane: () => tone(1180, 0.12, 'sine', 0.07),
  wall: () => tone(120, 0.03, 'triangle', 0.04),
  launch: () => tone(180, 0.3, 'sawtooth', 0.06, 700),
  drain: () => tone(300, 0.6, 'sawtooth', 0.07, -250),
  well: () => { tone(200, 0.5, 'sine', 0.08, 900); },
  fanfare: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.05, 0, i * 0.09)),
};
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- HUD ---------- */
const elScore = $('score'), elBall = $('ballNo'), elMult = $('mult'), elTicker = $('ticker');
let shownScore = -1;
function hud() {
  if (score !== shownScore) { elScore.textContent = score.toLocaleString('en-US'); shownScore = score; }
  elBall.textContent = state === 'play' ? Math.min(ballNo, 3) + '/3' : '–';
  elMult.textContent = '×' + mult;
}
function say(text, dur = 2.2) { elTicker.textContent = text; tickerT = dur; }
function add(points) { score += points * mult; }

/* ---------- rules ---------- */
function goal(label, bonus) {
  goals++; score += bonus; sfx.fanfare(); buzz(30);
  if (goals % 6 === 0 && rank < RANKS.length - 1) {
    rank++; score += 25000;
    say('Promoted: ' + RANKS[rank] + ' +25,000', 3);
  } else say(label, 2.6);
}
function hitLane(l) {
  sfx.lane(); add(300);
  if (!l.lit) {
    l.lit = true;
    if (lanes.every(x => x.lit)) {
      lanes.forEach(x => x.lit = false);
      if (mult < 6) mult++;
      goal('Lanes clear. Bonus ×' + mult, 2000);
    }
  }
}
function hitTarget(t) {
  t.flash = 1; sfx.target(); add(500);
  if (!t.lit) {
    t.lit = true;
    const bank = targets.filter(x => x.side === t.side);
    if (bank.every(x => x.lit)) {
      bank.forEach(x => x.lit = false);
      if (t.side === 0) { well.lit = true; goal('Gravity well charged', 5000); }
      else { saveT = Math.max(saveT, 20); goal('Shield up: ball saver on', 5000); }
    }
  }
}
function rotateLanes(dir) {
  const v = lanes.map(l => l.lit);
  lanes.forEach((l, i) => l.lit = v[(i + dir + 3) % 3]);
}
function newBall(auto) {
  ball = { x: 376, y: 668, vx: 0, vy: 0, inLane: true, held: 0, auto: auto ? 0.7 : 0, saved: !!auto, launched: false };
  trail.length = 0; charge = 0; stuckT = 0;
  if (!auto) say('Hold the right side, then release', 60);
}
function newGame() {
  score = 0; ballNo = 1; mult = 1; bumperHits = 0; goals = 0; rank = 0; saveT = 0; nextBallT = 0;
  lanes.forEach(l => l.lit = false); targets.forEach(t => t.lit = false); well.lit = false;
  state = 'play'; $('overlay').hidden = true;
  newBall(false); hud();
}
function launch(power) {
  ball.vy = -(1050 + 850 * power); ball.vx = 0; ball.launched = true; ball.auto = 0;
  sfx.launch(); buzz(15);
  if (tickerT > 10) say(RANKS[rank] + ' on deck', 1.6);
}
function drain() {
  ball = null; trail.length = 0;
  if (saveT > 0) { saveT = 0; say('Ball saved', 2); tone(660, 0.2, 'sine', 0.07, 300); newBall(true); return; }
  sfx.drain(); buzz(60);
  const bonus = bumperHits * 50 * mult;
  score += bonus;
  say(bonus ? 'End of ball bonus +' + bonus.toLocaleString('en-US') : 'Ball lost', 2.4);
  bumperHits = 0; mult = 1; ballNo++; nextBallT = 1.7;
}
function gameOver() {
  state = 'over';
  const record = score > best;
  if (record) { best = score; try { localStorage.setItem('nebula-drift-best', String(best)); } catch (e) {} }
  $('ovTitle').innerHTML = 'Game over<span>' + RANKS[rank] + '</span>';
  $('ovScore').hidden = false; $('ovScore').textContent = score.toLocaleString('en-US');
  $('ovBest').hidden = false; $('ovBest').textContent = record ? 'New best score' : 'Best ' + best.toLocaleString('en-US');
  $('ovText').hidden = true;
  $('go').textContent = 'Play again';
  $('overlay').hidden = false;
  say('Game over', 60); hud();
}

/* ---------- physics ---------- */
function pushOut(b, s, rad) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
  let t = ((b.x - s.x1) * dx + (b.y - s.y1) * dy) / (dx * dx + dy * dy);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = s.x1 + dx * t, cy = s.y1 + dy * t;
  let nx = b.x - cx, ny = b.y - cy;
  const d2 = nx * nx + ny * ny, R = BR + rad;
  if (d2 >= R * R) return null;
  let d = Math.sqrt(d2);
  if (d < 1e-6) { nx = -dy; ny = dx; d = Math.hypot(nx, ny); }
  nx /= d; ny /= d;
  b.x = cx + nx * R; b.y = cy + ny * R;
  hit.nx = nx; hit.ny = ny; hit.cx = cx; hit.cy = cy;
  return hit;
}
const hit = { nx: 0, ny: 0, cx: 0, cy: 0 };
function bounce(b, s) {
  const h = pushOut(b, s, 0);
  if (!h) return 0;
  const vn = b.vx * h.nx + b.vy * h.ny;
  if (vn >= 0) return 0;
  const e = vn > -45 ? 0 : s.e;
  b.vx -= (1 + e) * vn * h.nx; b.vy -= (1 + e) * vn * h.ny;
  return -vn;
}
function spark(x, y, color, n) {
  if (reduceMotion) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = 60 + Math.random() * 160;
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + Math.random() * 0.25, color });
  }
}
function step(dt) {
  for (const f of flippers) {
    const tgt = f.on ? f.up : f.rest, old = f.a, d = tgt - f.a, m = (f.on ? 24 : 14) * dt;
    f.a += Math.abs(d) < m ? d : Math.sign(d) * m;
    f.w = (f.a - old) / dt;
  }
  const b = ball;
  if (!b || b.held > 0) return;
  b.vy += G * dt;
  b.x += b.vx * dt; b.y += b.vy * dt;

  for (let i = 0; i < segs.length; i++) {
    const s = segs[i], imp = bounce(b, s);
    if (!imp) continue;
    if (s.sling != null && imp > 90) {
      b.vx += hit.nx * 400; b.vy += hit.ny * 400;
      slingFlash[s.sling] = 1; add(20); sfx.sling(); buzz(8);
    } else if (s.target && imp > 60) hitTarget(s.target);
    else if (imp > 260 && clock - lastWall > 0.07) { lastWall = clock; sfx.wall(); }
  }
  if (!b.inLane) bounce(b, gate);

  for (const p of bumpers) {
    const dx = b.x - p.x, dy = b.y - p.y, R = p.r + BR, d2 = dx * dx + dy * dy;
    if (d2 >= R * R) continue;
    const d = Math.sqrt(d2) || 1, nx = dx / d, ny = dy / d;
    b.x = p.x + nx * R; b.y = p.y + ny * R;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { b.vx -= 1.8 * vn * nx; b.vy -= 1.8 * vn * ny; }
    b.vx += nx * 400; b.vy += ny * 400;
    p.flash = 1; bumperHits++; add(100); sfx.bumper(); buzz(10);
    spark(b.x - nx * BR, b.y - ny * BR, C.hot, 6);
  }

  for (const f of flippers) {
    const s = { x1: f.x, y1: f.y, x2: f.x + Math.cos(f.a) * FL, y2: f.y + Math.sin(f.a) * FL };
    const h = pushOut(b, s, 7);
    if (!h) continue;
    const rx = h.cx - f.x, ry = h.cy - f.y;
    const sx = -f.w * ry, sy = f.w * rx;
    let ux = b.vx - sx, uy = b.vy - sy;
    const vn = ux * h.nx + uy * h.ny;
    if (vn < 0) {
      const e = vn > -60 ? 0 : 0.32;
      ux -= (1 + e) * vn * h.nx; uy -= (1 + e) * vn * h.ny;
      b.vx = ux + sx; b.vy = uy + sy;
    }
  }

  const sp = Math.hypot(b.vx, b.vy), cap = b.inLane ? 2000 : 1500;
  if (sp > cap) { b.vx *= cap / sp; b.vy *= cap / sp; }

  if (b.inLane && b.x < 356) {
    b.inLane = false;
    if (!b.saved) { saveT = Math.max(saveT, 10); b.saved = true; }
  }
  for (const l of lanes) {
    const inside = Math.abs(b.x - l.x) < 14 && Math.abs(b.y - l.y) < 12;
    if (inside && !l.inside) hitLane(l);
    l.inside = inside;
  }
  {
    const inside = Math.hypot(b.x - beacon.x, b.y - beacon.y) < 17;
    if (inside && !beacon.inside) { beacon.flash = 1; add(750); sfx.lane(); }
    beacon.inside = inside;
  }
  if (well.cool <= 0 && Math.hypot(b.x - well.x, b.y - well.y) < 13) {
    b.held = 0.9; b.x = well.x; b.y = well.y; b.vx = b.vy = 0; sfx.well(); buzz(20);
    if (well.lit) { well.lit = false; score += 20000; say('Gravity well jackpot +20,000', 2.6); }
    else { add(2500); say('Gravity well', 1.4); }
  }
  if (b.y > H + 40) drain();
}

/* ---------- per-frame update ---------- */
function update(dt) {
  clock += dt;
  if (tickerT > 0) { tickerT -= dt; if (tickerT <= 0 && state === 'play') elTicker.textContent = RANKS[rank] + ' · ' + (goals % 6) + '/6 to next rank'; }
  for (const p of bumpers) p.flash = Math.max(0, p.flash - dt * 5);
  for (const t of targets) t.flash = Math.max(0, t.flash - dt * 4);
  beacon.flash = Math.max(0, beacon.flash - dt * 3);
  slingFlash[0] = Math.max(0, slingFlash[0] - dt * 6); slingFlash[1] = Math.max(0, slingFlash[1] - dt * 6);
  well.cool = Math.max(0, well.cool - dt); well.spin += dt * (well.lit ? 5 : 1.6);
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 300 * dt;
    if (s.life <= 0) sparks.splice(i, 1);
  }
  if (state !== 'play') return;
  if (saveT > 0 && ball && !ball.inLane) saveT = Math.max(0, saveT - dt);

  if (!ball) {
    nextBallT -= dt;
    if (nextBallT <= 0) { if (ballNo > 3) gameOver(); else newBall(false); }
    return;
  }
  const b = ball;
  if (b.held > 0) {
    b.held -= dt;
    if (b.held <= 0) { b.held = 0; well.cool = 1.2; b.vx = 190 + Math.random() * 130; b.vy = 260; tone(500, 0.15, 'sine', 0.07, -300); }
    return;
  }
  const ready = b.inLane && b.y > 655 && Math.hypot(b.vx, b.vy) < 40;

/* ---------- loop ---------- */
